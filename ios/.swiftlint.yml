# Deviations for the plugin's Swift under ios/. Defaults apply except the rules below.
# The example's RunnerTests have their own example/ios/.swiftlint.yml, because SwiftLint resolves
# `included`/`excluded` per config directory. Paths below are relative to this file.
included:
  - text_sight/Sources/text_sight
excluded:
  - text_sight/Sources/text_sight/Messages.g.swift  # Pigeon-generated

disabled_rules:
  - file_length       # the camera/Vision file is one cohesive unit, and Dart caps no file length
  - type_body_length  # likewise the camera controller type
  - trailing_comma    # trailing commas are kept, consistent with the project's Dart style

large_tuple:
  warning: 3          # displayRotation's named 3-tuple, where a struct would only add ceremony
