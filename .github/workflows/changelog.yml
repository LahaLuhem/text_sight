name: Update changelog

on:
  pull_request_target:
    types: [closed]
    branches: [main]

# Serialize so back-to-back merges don't race on the push to main.
# cancel-in-progress is OFF, since every merged PR must actually get its line.
concurrency:
  group: changelog-main
  cancel-in-progress: false

# pull_request_target runs in the base-repo context, so write scopes hold even for fork PRs.
# The workflow always loads from main and never checks out PR code, so the token is never
# exposed to PR-controlled scripts.
permissions:
  contents: write

jobs:
  log:
    name: Append cider entry
    # Skip merged bot PRs: no sem-* label means no cider type to resolve. Add an entry by hand if
    # a root-package bump is user-visible.
    if: github.event.pull_request.merged == true && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve sem-* label → cider type
        id: sem
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          sem=$(echo "$LABELS" | jq -r '.[] | select(startswith("sem-"))' | head -n1)
          case "$sem" in
            sem-skip)      echo 'type=skip'       >> "$GITHUB_OUTPUT" ;;
            sem-add)       echo 'type=added'      >> "$GITHUB_OUTPUT" ;;
            sem-change)    echo 'type=changed'    >> "$GITHUB_OUTPUT" ;;
            sem-deprecate) echo 'type=deprecated' >> "$GITHUB_OUTPUT" ;;
            sem-remove)    echo 'type=removed'    >> "$GITHUB_OUTPUT" ;;
            sem-bugfix)    echo 'type=fixed'      >> "$GITHUB_OUTPUT" ;;
            sem-security)  echo 'type=security'   >> "$GITHUB_OUTPUT" ;;
            *)
              if [ -z "$sem" ]; then
                echo "::error::PR has no sem-* label. pr-conventions should have blocked this, investigate."
              else
                echo "::error::Unrecognized sem-* label: '$sem'."
              fi
              exit 1
              ;;
          esac

      - name: Skip (sem-skip)
        if: steps.sem.outputs.type == 'skip'
        run: echo 'sem-skip applied, no changelog entry.'

      # Short-lived token for the GitHub App that bypasses main's ruleset.
      # GITHUB_TOKEN cannot: branch protection blocks `github-actions[bot]`
      # pushes, and that identity cannot go in the bypass list. The App can.
      - uses: actions/create-github-app-token@v3
        id: app-token
        if: steps.sem.outputs.type != 'skip'
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        if: steps.sem.outputs.type != 'skip'
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      # cider comes from `pub global activate`, so no project deps and no
      # setup-flutter. Same ~10-30s saving as repo.yml's format job.
      - uses: dart-lang/setup-dart@v1
        if: steps.sem.outputs.type != 'skip'
        with:
          sdk: stable

      - name: Activate cider
        if: steps.sem.outputs.type != 'skip'
        run: dart pub global activate cider

      - name: Append entry and push
        if: steps.sem.outputs.type != 'skip'
        env:
          TYPE: ${{ steps.sem.outputs.type }}
          TITLE: ${{ github.event.pull_request.title }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          # Look the bot's user ID up at runtime so the commit links to the App's
          # avatar, rather than hard-coding a value someone has to go find.
          APP_USER_ID=$(curl -s "https://api.github.com/users/${APP_SLUG}%5Bbot%5D" | jq -r .id)
          git config user.name  "${APP_SLUG}[bot]"
          git config user.email "${APP_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          dart pub global run cider log "$TYPE" "$TITLE"
          git add CHANGELOG.md
          # [skip ci] matters here: App-token pushes trigger workflows, unlike
          # GITHUB_TOKEN ones, so without it this re-runs the package CI on main.
          git commit -m 'Changelog updated [skip ci]'
          git push origin HEAD:main
