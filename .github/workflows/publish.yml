name: Publish to pub.dev

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+' # tag-pattern on pub.dev: '{{version}}'

# Inlined, not setup-dart's reusable publish workflow: that one runs `dart pub get` without
# `--no-example`, which rewrites example/pubspec.lock and trips the dry-run's "checked-in files are
# modified" guard. `flutter pub get`, not `dart`, satisfies the `flutter: sdk: flutter` constraint,
# and setup-dart stays first so its OIDC env is ready before publish.
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC auth to pub.dev (configured by dart-lang/setup-dart).
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies (root only, skipping example/)
        run: flutter --no-version-check pub get --no-example
      - name: Publish dry-run
        run: flutter --no-version-check pub publish --dry-run
      - name: Publish to pub.dev
        run: flutter --no-version-check pub publish --force
