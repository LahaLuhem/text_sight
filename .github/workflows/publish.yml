name: Publish to pub.dev

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+' # tag-pattern on pub.dev: '{{version}}'

# Inlined rather than using setup-dart's reusable publish workflow, which runs `dart pub get`
# without `--no-example`. That resolves example/ against CI's Flutter instead of the .fvmrc-pinned
# one, rewriting example/pubspec.lock, and the dry-run then trips its "checked-in files are
# modified" guard. `flutter pub get` (not dart) satisfies the `flutter: sdk: flutter` constraint,
# and setup-dart stays first so its OIDC env is in place before publish runs.
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC auth to pub.dev (configured by dart-lang/setup-dart).
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies (root only, skipping example/)
        run: flutter --no-version-check pub get --no-example
      - name: Publish dry-run
        run: flutter --no-version-check pub publish --dry-run
      - name: Publish to pub.dev
        run: flutter --no-version-check pub publish --force
