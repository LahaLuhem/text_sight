name: Package checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  # Per PR, or per ref on a direct push to main. A newer event cancels the older run.
  group: pkg-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # A push to main that is just a merged PR was already checked on that PR, so the jobs below
  # skip it. A direct push, and every PR, still runs them. The payload cannot tell the two apart,
  # so ask the API whether the pushed commit belongs to a merged PR.
  gate:
    name: Decide whether to run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"   # PRs always run
            exit 0
          fi
          # Did the pushed commit land via a merged PR? If so, it's a post-merge push.
          merged=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
                     --jq '[.[] | select(.merged_at != null)] | length' 2>/dev/null || echo 0)
          if [ "${merged:-0}" -gt 0 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"  # already checked on the PR, skip
          else
            echo "run=true" >> "$GITHUB_OUTPUT"   # direct push to main, run
          fi

  analyze:
    name: Flutter analyze
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-flutter
      # example/ resolves its own deps and is analyzed by example.yml, so it is not included here.
      - run: flutter --no-version-check analyze --fatal-infos lib test pigeons

  format:
    name: Dart format
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-flutter
      # Whole repo, enforcing analysis_options' formatter.page_width: 100. dart format needs no
      # resolved deps, so one root run covers lib/test/pigeons AND example/.
      - run: dart format --output=none --set-exit-if-changed .

  # No DCM job yet, pending dcm.dev's free open-source licence and its secrets. The rules live in
  # analysis_options.yaml and are applied by hand meanwhile. Restore the job from git history once
  # the licence lands.

  detekt:
    name: detekt (Kotlin)
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      # detekt analyses the Kotlin sources directly, so no Gradle/Android SDK needed. The config
      # layers this project's deviations onto detekt's default ruleset. Messages.g.kt is generated.
      - run: |
          curl -fsSL -o detekt-cli.jar https://github.com/detekt/detekt/releases/download/v1.23.8/detekt-cli-1.23.8-all.jar
          java -jar detekt-cli.jar --build-upon-default-config --config android/detekt.yml --input android/src --excludes '**/Messages.g.kt'

  deps:
    name: Dependency validator
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-flutter
      - run: dart pub global activate dependency_validator
      - run: dart pub global run dependency_validator

  test:
    name: Tests
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-flutter
      - run: flutter --no-version-check test

  # --- Native plugin CI ---
  # iOS links zero third-party ML libraries, which is the package's whole point. The Dart jobs
  # never touch the native sides, so these build the example per platform.

  android-example:
    name: Android example build + unit tests
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          # Restores ~/.gradle across runs (AGP, Kotlin, CameraX, ML Kit, Robolectric's android-all
          # jars, JUnit/Mockito), otherwise every run re-downloads the whole dependency graph.
          cache: gradle
      - uses: ./.github/actions/setup-flutter
        with:
          working-directory: example
      # --release so R8 runs over the Kotlin and ML Kit deps. A missing keep rule in
      # consumer-rules.pro only shows at runtime, so this guards compile and shrink time only.
      - run: flutter --no-version-check build apk --release
        working-directory: example
      # Kotlin unit tests run in the example's Gradle build, where the Flutter Gradle plugin supplies
      # io.flutter. The standalone android/ build cannot resolve it in CI, since its local.properties
      # is gitignored.
      - run: ./gradlew :text_sight:testDebugUnitTest
        working-directory: example/android

  ios-build:
    name: iOS release build + no-bundling
    # Split from the tests job so the two macOS legs run in parallel instead of one after the other.
    # This leg is the only release-mode device compile in CI, so it stays a full build.
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-flutter
        with:
          working-directory: example
      - run: flutter --no-version-check build ios --release --no-codesign
        working-directory: example
      # No ML Kit under example/ios, sources and the generated SPM manifest alike. grep not rg, so
      # the gitignored generated path is scanned, and -I skips binaries.
      - name: Assert no ML Kit on the iOS side
        run: |
          if grep -rEiI 'mlkit|googlemlkit|mlimage' example/ios; then
            echo "::error::ML Kit found under example/ios, no-bundling invariant (APPENDIX.md#no-bundling) broken."
            exit 1
          fi

  ios-tests:
    name: iOS unit tests + SwiftLint
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-flutter
        with:
          working-directory: example
      # --config-only writes Generated.xcconfig and the SPM manifest without compiling, so the only
      # compile here is xcodebuild's simulator build below. A full `flutter build` would compile twice
      # and send Runner.app where the test host cannot find it.
      - run: flutter --no-version-check build ios --config-only --debug --simulator
        working-directory: example
      # Native XCTest (example/ios/RunnerTests) through the Runner scheme. Pick the first available
      # iPhone simulator so no device name is hardcoded across runner images.
      - name: RunnerTests (iOS simulator)
        working-directory: example/ios
        run: |
          DEVICE_ID=$(xcrun simctl list devices available --json \
            | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid // empty')
          if [ -z "$DEVICE_ID" ]; then
            echo "::error::No iPhone simulator available on the runner"
            exit 1
          fi
          # -quiet trims a several-thousand-line transcript to warnings and errors. A failing test still
          # prints, and the bundle carries the rest. -parallel-testing-enabled NO skips cloning the
          # simulator, which cost more than the 29s it was parallelising.
          xcodebuild test -quiet \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/RunnerTests.xcresult" \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -only-testing:RunnerTests \
            -destination "platform=iOS Simulator,id=$DEVICE_ID,arch=$(uname -m)" \
            CODE_SIGNING_ALLOWED=NO
      # Non-parallel runs print no per-test lines under -quiet, so report the tally from the bundle.
      - name: Test summary
        if: always()
        run: |
          bundle="$RUNNER_TEMP/RunnerTests.xcresult"
          [ -d "$bundle" ] || exit 0
          summary="$RUNNER_TEMP/summary.json"
          xcrun xcresulttool get test-results summary --path "$bundle" > "$summary"
          jq -r '"result=\(.result) total=\(.totalTestCount) passed=\(.passedTests) failed=\(.failedTests)"' "$summary"
          # -quiet drops swift-testing output entirely, so for those the bundle is the only place a
          # failure's name and message survive. xcodebuild's exit code is still what fails the job.
          jq -r '.testFailures[]? | "FAILED \(.testName): \(.failureText)"' "$summary"
      # Two configs, because SwiftLint resolves included/excluded relative to each config's own dir.
      # Folded into this macOS job to avoid a second ~10x-cost runner, binary version-pinned.
      - name: SwiftLint
        run: |
          curl -fsSL -o "$RUNNER_TEMP/swiftlint.zip" https://github.com/realm/SwiftLint/releases/download/0.63.3/portable_swiftlint.zip
          unzip -oq "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
          SL="$RUNNER_TEMP/swiftlint/swiftlint"
          # Disjoint trees, so lint concurrently, each to its own log. The step fails if either run does,
          # so all errors surface in one go rather than just the first config's.
          "$SL" lint --strict --config ios/.swiftlint.yml > "$RUNNER_TEMP/sl-plugin.log" 2>&1 & p1=$!
          "$SL" lint --strict --config example/ios/.swiftlint.yml > "$RUNNER_TEMP/sl-tests.log" 2>&1 & p2=$!
          r1=0; wait "$p1" || r1=$?
          r2=0; wait "$p2" || r2=$?
          echo "::group::SwiftLint, plugin (ios/.swiftlint.yml)"; cat "$RUNNER_TEMP/sl-plugin.log"; echo "::endgroup::"
          echo "::group::SwiftLint, RunnerTests (example/ios/.swiftlint.yml)"; cat "$RUNNER_TEMP/sl-tests.log"; echo "::endgroup::"
          [ "$r1" -eq 0 ] && [ "$r2" -eq 0 ]

  codegen-freshness:
    name: Codegen freshness (Pigeon + build_runner)
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-flutter
      # Pigeon writes the wire types, build_runner writes the copyWiths. Neither knows about the
      # other, so order does not matter.
      - run: dart run pigeon --input pigeons/text_sight.dart
      - run: dart run build_runner build --delete-conflicting-outputs
      # Both emit ~80-column Dart and the gate is 100, so the regen is never complete without this.
      - run: dart format lib
      - name: Assert generated code is up to date
        run: |
          # --porcelain rather than `git diff`, which cannot see a generator's brand-new untracked
          # file.
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "::error::Generated code is stale. Run: dart run pigeon --input pigeons/text_sight.dart && dart run build_runner build --delete-conflicting-outputs && dart format lib"
            exit 1
          fi

  # Single required-check contract for the ruleset. APPENDIX.md#dependabot-automerge
  package-ok:
    needs: [gate, analyze, format, detekt, deps, test, android-example, ios-build, ios-tests, codegen-freshness]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fail if any upstream job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        env:
          RESULTS: >-
            gate=${{ needs.gate.result }}
            analyze=${{ needs.analyze.result }}
            format=${{ needs.format.result }}
            detekt=${{ needs.detekt.result }}
            deps=${{ needs.deps.result }}
            test=${{ needs.test.result }}
            android-example=${{ needs.android-example.result }}
            ios-build=${{ needs.ios-build.result }}
            ios-tests=${{ needs.ios-tests.result }}
            codegen-freshness=${{ needs.codegen-freshness.result }}
        run: |
          echo "$RESULTS"
          exit 1
