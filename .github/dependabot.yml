# Dependabot version updates.
# Reference: https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
#
# Bot PRs skip the branch-name, sem-label and changelog jobs, so they land with no CHANGELOG
# entry. Add one by hand if a root-package bump is user-visible.
# Grouping, and what automerges: APPENDIX.md#dependabot-automerge
version: 2

updates:
  # --- Dart / Flutter: published library ---
  # Bumps the root pubspec's constraints. pub.dev only, git and path deps are not eligible.
  #
  # `versioning-strategy: increase` raises the floor instead of widening the range, which is what
  # `auto` does once it reads `version:` as a library. /example stays on `auto`.
  - package-ecosystem: "pub"
    directory: "/"
    versioning-strategy: "increase"
    schedule:
      interval: "weekly"
    groups:
      pub:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # --- Dart / Flutter: example app ---
  - package-ecosystem: "pub"
    directory: "/example"
    schedule:
      interval: "weekly"
    groups:
      pub-example:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # --- Android / Gradle: plugin module ---
  # The only place recognition and camera deps may live, and they reach every Android consumer
  # through the AAR's POM, so weigh the transitive closure per PR. Also covers AGP, the JVM test
  # stack, and the wrapper.
  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
    groups:
      gradle-plugin:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # --- Android / Gradle: example app ---
  # Covers the *.gradle.kts deps and the wrapper version in gradle-wrapper.properties.
  - package-ecosystem: "gradle"
    directory: "/example/android"
    schedule:
      interval: "weekly"
    groups:
      gradle-example:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # --- GitHub Actions ---
  # `directory: "/"` scans everything under .github/, workflows and the local composite actions.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # --- Python: benchmark orchestrator / analyzer (uv-managed) ---
  # Bumps pyproject.toml constraints + uv.lock under benchmark/python. Same grouping as
  # the others: minor/patch grouped into one PR, majors individual for isolated review.
  - package-ecosystem: "uv"
    directory: "/benchmark/python"
    schedule:
      interval: "weekly"
    groups:
      uv:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # --- No `swift` (SPM) ecosystem (yet) ---
  # Not a ban (hard rule 2 is prefer-native, not zero-dependency), just nothing to track:
  # Package.swift has only a local `path:` dep and the example's manifest is generated + gitignored.
  # Add a `swift` block the day a registry dep lands.
