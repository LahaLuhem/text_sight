# detekt deviations for android/src. Run with `--build-upon-default-config`, so this lists ONLY
# what differs from the default ruleset. Messages.g.kt is generated and excluded at the CLI.

complexity:
  TooManyFunctions:
    # The plugin entrypoint and the camera/recognition controller legitimately expose many small
    # functions, and the Dart side enforces no function-count cap either.
    active: false
  LongParameterList:
    # The per-frame encoder helpers take the frame geometry positionally on the hot path, so param
    # count isn't enforced on the Dart side.
    active: false

naming:
  PackageNaming:
    # Package is lowercase now (com.lahaluhem.text_sight), so keep this rule ACTIVE so it stays that
    # way. The pattern only adds `_` to detekt's default allowed segment chars, since the
    # `text_sight` segment deliberately mirrors the pub package name (the default forbids underscores).
    packagePattern: '[a-z]+(\.[a-z][A-Za-z0-9_]*)*'

style:
  MagicNumber:
    # Mirrors the Dart side, which disables `no-magic-number`. The rotation/normalisation constants
    # in the camera math read fine inline.
    active: false

exceptions:
  SwallowedException:
    # The control methods convert a CameraX / ML Kit failure into the FlutterError code the Dart side
    # switches on. Pigeon's generated FlutterError has no `cause` slot, so forwarding the message is
    # the only channel there is, so the rule's fix is unavailable, not declined.
    active: false
  TooGenericExceptionCaught:
    # The camera init converts any native failure into a `FlutterError` at the channel boundary, a
    # deliberate broad catch. (Re-enable and `@Suppress` that single site if stricter checking is wanted.)
    active: false
