# detekt deviations for android/src. Run with `--build-upon-default-config`, so this lists ONLY
# what differs from the default ruleset. Messages.g.kt is generated and excluded at the CLI.

complexity:
  TooManyFunctions:
    # The plugin entrypoint and the camera/recognition controller legitimately expose many small
    # functions, and the Dart side enforces no function-count cap either.
    active: false
  LongParameterList:
    # The per-frame encoder helpers take the frame geometry positionally on the hot path, so param
    # count isn't enforced on the Dart side.
    active: false

naming:
  PackageNaming:
    # Kept on so the package stays lowercase (com.lahaluhem.text_sight). The pattern only adds `_`
    # to the default's segment chars, since the `text_sight` segment mirrors the pub package name.
    packagePattern: '[a-z]+(\.[a-z][A-Za-z0-9_]*)*'

style:
  MagicNumber:
    # Mirrors the Dart side, which disables `no-magic-number`. The rotation/normalisation constants
    # in the camera math read fine inline.
    active: false

exceptions:
  SwallowedException:
    # Control methods turn a CameraX / ML Kit failure into the FlutterError code Dart switches on,
    # and Pigeon's FlutterError has no `cause` slot, so the rule's fix isn't available.
    active: false
  TooGenericExceptionCaught:
    # Camera init turns any native failure into a `FlutterError` at the channel boundary, a broad
    # catch on purpose. For stricter checks, re-enable this and `@Suppress` that one site.
    active: false
