# SwiftLint deviations for the example's RunnerTests (the plugin's native unit tests), apart from
# ios/.swiftlint.yml since SwiftLint resolves paths from each config's own folder.
included:
  - RunnerTests

disabled_rules:
  - trailing_comma    # trailing commas are kept, consistent with the project's Dart style
  - file_length       # tests grow with coverage, and splitting means project.pbxproj surgery

identifier_name:
  min_length:
    warning: 2        # allow short, clear domain names (e.g. `up` in the rotation tests)
