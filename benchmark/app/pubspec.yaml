name: text_sight_bench_host
description: "Host app for text_sight device benchmark scenarios (integration_test, profile mode)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  text_sight:
    path: ../../

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  # The codec scenario imports benchmark/harness/capture_codec.dart directly, which needs this.
  standard_message_codec: ^0.0.1+5

flutter:
  uses-material-design: true
