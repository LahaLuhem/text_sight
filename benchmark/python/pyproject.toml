# Benchmark orchestrator / analyzer for text_sight, managed by `uv`.
# Commands are in ../README.md#running.
#
# `uv.lock` is checked in for reproducible analysis, since perf claims are only
# defensible if the stack is pinned.

[project]
name = "text-sight-benchmark"
version = "0.1.0"
description = "Benchmark orchestration + reporting for the text_sight captures-transport codec."
requires-python = ">=3.10"

# polars (Rust-backed) for analysis, seaborn/matplotlib for the committed
# README charts. pyarrow is what lets seaborn read a polars frame directly. Drop
# it and seaborn falls back to a path pandas has deprecated.
# No scipy/jinja2, since there is no `compare` (Mann-Whitney) layer yet and the
# markdown is plain f-strings.
dependencies = [
    "polars>=1.0,<2.0",
    "matplotlib>=3.8,<4.0",
    "seaborn>=0.13,<1.0",
    "pyarrow>=15.0,<26.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6,<1.0",
    # 9.1 floor: the [tool.pytest] table below needs 9.0+, `max_warnings` needs 9.1+.
    "pytest>=9.1,<10.0",
]

# Native TOML, so values keep their real types instead of pytest's INI string mode.
[tool.pytest]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-ra"]
strict = true  # unknown config keys, unregistered markers and loose xfails all become errors
# Quoted because pytest registers these two as string options. An int is a TypeError.
max_warnings = "0"  # a stray warning means a dep quietly took a deprecated path
faulthandler_timeout = "60"  # a deadlock in the threaded adb-grant tests shouldn't wait out the job
faulthandler_exit_on_timeout = true

[tool.ruff]
# Matches the Dart side's 100-column width (analysis_options.yaml formatter).
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
